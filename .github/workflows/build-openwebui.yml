name: Build Open WebUI frontend
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fork-manifest.json'
      - 'patches/native/**'
      - 'scripts/frontend-artifact.py'
      - 'scripts/setup-fork.py'
      - 'scripts/check-fork.py'
      - '.github/workflows/build-openwebui.yml'
permissions:
  contents: read
concurrency:
  group: openwebui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CYPRESS_INSTALL_BINARY: '0'
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore patched upstream
        run: |
          git config --global user.name 'AI Firewall CI'
          git config --global user.email 'ci@synthetic.invalid'
          python3 scripts/setup-fork.py
          python3 scripts/check-fork.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: forks/open-webui/package-lock.json
      - name: Install locked dependencies
        working-directory: forks/open-webui
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build original Native frontend
        working-directory: forks/open-webui
        run: |
          node node_modules/@sveltejs/kit/svelte-kit.js sync
          node node_modules/vite/bin/vite.js build
      - name: Validate routes and package provenance
        run: python3 scripts/frontend-artifact.py pack artifacts/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: openwebui-frontend-${{ github.sha }}
          path: artifacts/frontend/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14